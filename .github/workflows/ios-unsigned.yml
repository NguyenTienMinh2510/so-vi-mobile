name: Unsigned iOS Release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: unsigned-ios-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check and build unsigned arm64 Release
        run: bash scripts/build-ios-unsigned.sh
      - uses: actions/upload-artifact@v4
        with:
          name: so-vi-unsigned-ios
          path: apps/mobile/build-artifacts/so-vi-unsigned.ipa*
          if-no-files-found: error
          retention-days: 1
