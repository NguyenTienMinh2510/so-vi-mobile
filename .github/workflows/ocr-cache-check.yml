name: OCR cache boundary check
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ocr-cache-boundary-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check synthetic OCR paths and frozen boundary suite
        run: |
          export DEVELOPER_DIR="/Applications/Xcode_26.6.app/Contents/Developer"
          test -d "$DEVELOPER_DIR"
          swiftc -swift-version 5 modules/so-vi-native/ios/OCRCachePaths.swift tests/native-ocr-path-diagnostic.swift -o "$RUNNER_TEMP/ocr-path-probe"
          "$RUNNER_TEMP/ocr-path-probe"
          swiftc -swift-version 5 modules/so-vi-native/ios/OCRCachePaths.swift tests/native-ocr-cache-check.swift -o "$RUNNER_TEMP/ocr-cache-check"
          "$RUNNER_TEMP/ocr-cache-check"
